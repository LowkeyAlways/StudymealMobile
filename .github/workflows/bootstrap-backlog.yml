name: Bootstrap product backlog

on:
  push:
    branches: [main]
    paths: ['.github/backlog.json', '.github/labels.json', '.github/workflows/bootstrap-backlog.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create labels, issues and native relationships
        uses: actions/github-script@v7
        with:
          script: |
            const labels = require('./.github/labels.json');
            const backlog = require('./.github/backlog.json');
            const { owner, repo } = context.repo;

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
                await github.rest.issues.updateLabel({
                  owner, repo, name: label.name, new_name: label.name,
                  color: label.color, description: label.description,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100,
            });
            const byTitle = new Map(
              existing.filter((issue) => !issue.pull_request).map((issue) => [issue.title, issue]),
            );
            const byKey = new Map();

            for (const definition of backlog.issues) {
              let issue = byTitle.get(definition.title);
              if (!issue) {
                const result = await github.rest.issues.create({
                  owner, repo, title: definition.title, body: definition.body, labels: definition.labels,
                });
                issue = result.data;
                core.info(`Created #${issue.number}: ${issue.title}`);
              } else {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: definition.labels,
                });
                core.info(`Found #${issue.number}: ${issue.title}`);
              }
              byKey.set(definition.key, issue);
            }

            async function link(mutation, variables, description) {
              try {
                await github.graphql(mutation, variables);
                core.info(`Linked ${description}`);
              } catch (error) {
                const message = String(error.message || error);
                if (/already|exists|duplicate/i.test(message)) {
                  core.info(`Already linked ${description}`);
                  return;
                }
                throw error;
              }
            }

            for (const relation of backlog.subIssues) {
              await link(
                `mutation($parent: ID!, $child: ID!) {
                  addSubIssue(input: {issueId: $parent, subIssueId: $child}) { issue { id } }
                }`,
                { parent: byKey.get(relation.parent).node_id, child: byKey.get(relation.child).node_id },
                `${relation.child} as a sub-issue of ${relation.parent}`,
              );
            }

            for (const relation of backlog.blockedBy) {
              await link(
                `mutation($subject: ID!, $blocking: ID!) {
                  addBlockedBy(input: {subjectId: $subject, blockingIssueId: $blocking}) { issue { id } }
                }`,
                { subject: byKey.get(relation.subject).node_id, blocking: byKey.get(relation.blocking).node_id },
                `${relation.subject} blocked by ${relation.blocking}`,
              );
            }

            const projectTitle = 'Studymeal — Product roadmap';
            const projectQuery = `query($login: String!) {
              user(login: $login) {
                id
                projectsV2(first: 100) { nodes { id title url } }
              }
            }`;
            const projectOwner = await github.graphql(projectQuery, { login: owner });
            let project = projectOwner.user.projectsV2.nodes.find(
              (candidate) => candidate.title === projectTitle,
            );

            if (!project) {
              const createdProject = await github.graphql(
                `mutation($ownerId: ID!, $title: String!) {
                  createProjectV2(input: {ownerId: $ownerId, title: $title}) {
                    projectV2 { id title url }
                  }
                }`,
                { ownerId: projectOwner.user.id, title: projectTitle },
              );
              project = createdProject.createProjectV2.projectV2;
              core.info(`Created project: ${project.url}`);
            } else {
              core.info(`Found project: ${project.url}`);
            }

            const projectFields = await github.graphql(
              `query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField { id name options { id name color description } }
                      }
                    }
                  }
                }
              }`,
              { projectId: project.id },
            );
            let statusField = projectFields.node.fields.nodes.find((field) => field?.name === 'Status');

            // Le tableau possède une vraie colonne Backlog, distincte de « À faire ».
            if (statusField && !statusField.options.some((option) => /^backlog$/i.test(option.name))) {
              const updatedStatusField = await github.graphql(
                `mutation($fieldId: ID!, $options: [ProjectV2SingleSelectFieldOptionInput!]!) {
                  updateProjectV2Field(input: {fieldId: $fieldId, singleSelectOptions: $options}) {
                    projectV2Field {
                      ... on ProjectV2SingleSelectField { id name options { id name color description } }
                    }
                  }
                }`,
                {
                  fieldId: statusField.id,
                  options: [
                    ...statusField.options.map(({ id, name, color, description }) => ({
                      id, name, color, description,
                    })),
                    { name: 'Backlog', color: 'GRAY', description: 'À prioriser pour un futur jalon.' },
                  ],
                },
              );
              statusField = updatedStatusField.updateProjectV2Field.projectV2Field;
            }

            const definitionByKey = new Map(backlog.issues.map((definition) => [definition.key, definition]));

            for (const [key, issue] of byKey.entries()) {
              const added = await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item { id }
                  }
                }`,
                { projectId: project.id, contentId: issue.node_id },
              ).catch((error) => {
                if (/already|exists|duplicate/i.test(String(error.message || error))) return null;
                throw error;
              });

              const desiredStatus = definitionByKey.get(key).projectStatus || 'To do';
              const statusOption = statusField?.options.find(
                (option) => option.name.toLowerCase() === desiredStatus.toLowerCase()
                  || (desiredStatus === 'To do' && /^(todo|à faire)$/i.test(option.name)),
              );

              if (added && statusField && statusOption) {
                await github.graphql(
                  `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                      value: {singleSelectOptionId: $optionId}
                    }) { projectV2Item { id } }
                  }`,
                  {
                    projectId: project.id, itemId: added.addProjectV2ItemById.item.id,
                    fieldId: statusField.id, optionId: statusOption.id,
                  },
                );
              }
            }

            core.notice(`Project ready: ${project.url}`);
